{% extends "base.html" %}
{% block title %}Команды{% endblock %}
{% block content %}
<h1>👨‍✈️ Команды</h1>
<a href="/web/crews/new" class="btn btn-primary">+ Добавить команду</a>
<br><br>
<table>
    <tr>
        <th>ID</th>
        <th>Капитан</th>
        <th>Количество</th>
        <th>Действия</th>
    </tr>
    {% for crew in crews %}
    <tr>
        <td>{{ crew.id }}</td>
        <td>{{ crew.captain_name }}</td>
        <td>{{ crew.members_count }}</td>
        <td>
            <a href="/web/crews/{{ crew.id }}/edit" class="btn btn-warning">✏️</a>
            <form action="/web/crews/{{ crew.id }}/delete" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger">🗑️</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
