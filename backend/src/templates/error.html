{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="error-box">
    <h1>❌ Ошибка {{ code }}</h1>
    <p>{{ message }}</p>
    {% if details %}
    <pre>{{ details }}</pre>
    {% endif %}
    <a href="/" class="btn btn-primary">🏠 На главную</a>
</div>
{% endblock %}
