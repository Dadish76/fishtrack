<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FishTrack{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        nav { background: #2c3e50; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #34495e; color: white; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; color: white; }
        .btn-primary { background: #3498db; }
        .btn-danger { background: #e74c3c; }
        .btn-warning { background: #f39c12; }
        form { background: white; padding: 20px; border-radius: 5px; max-width: 500px; }
        form label { display: block; margin-top: 10px; font-weight: bold; }
        form input, form select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        form button { margin-top: 15px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error-box { background: #f8d7da; color: #721c24; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">🏠 Главная</a>
        <a href="/web/boats">🚢 Катера</a>
        <a href="/web/crews">👨‍✈️ Команды</a>
        <a href="/web/trips">⛵ Рейсы</a>
        <a href="/docs">📖 API Docs</a>
    </nav>
    <div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
