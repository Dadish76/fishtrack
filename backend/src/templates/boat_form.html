{% extends "base.html" %}
{% block title %}{{ "Редактировать" if boat else "Создать" }} катер{% endblock %}
{% block content %}
<h1>{{ "✏️ Редактировать" if boat else "➕ Создать" }} катер</h1>
<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="post" action="{{ '/web/boats/' + boat.id|string + '/edit' if boat else '/web/boats/new' }}">
            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" name="name" class="form-control" required value="{{ boat.name if boat else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Регистрационный номер</label>
                <input type="text" name="registration_number" class="form-control" required value="{{ boat.registration_number if boat else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Вместимость (тонн)</label>
                <input type="number" step="0.1" min="0.1" name="capacity" class="form-control" required value="{{ boat.capacity if boat else '' }}">
            </div>
            <button type="submit" class="btn btn-success">💾 Сохранить</button>
            <a href="/web/boats" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
