---
fishtrack_environment: demo
fishtrack_project_name: fishtrack-demo
fishtrack_directory: /opt/fishtrack-demo
fishtrack_http_port: 8082

fishtrack_ssh_allowed_cidr: "192.168.56.0/24"
fishtrack_firewall_remove_broad_ssh: true

fishtrack_source_ref: "feature/lab7-app-ansible"
fishtrack_dockerfile_path: Dockerfile

fishtrack_app_internal_port: 8000
fishtrack_db_name: fishtrack
fishtrack_db_user: fishtrack

# Указать схему из рабочего staging
fishtrack_db_scheme: "postgresql+psycopg2"

# Заменить на настоящую команду миграции из проекта
fishtrack_migration_command:
  - alembic
  - upgrade
  - head

fishtrack_directory_owner: root
fishtrack_directory_group: root
