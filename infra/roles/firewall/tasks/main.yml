---
- name: Verify SSH management network is configured
  ansible.builtin.assert:
    that:
      - fishtrack_ssh_allowed_cidr is defined
      - fishtrack_ssh_allowed_cidr | length > 0
    fail_msg: "SSH management network is required"

- name: Allow SSH from management network
  community.general.ufw:
    rule: allow
    port: "{{ fishtrack_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ fishtrack_ssh_allowed_cidr }}"
    direction: in

- name: Deny incoming connections by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing connections by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled

- name: Remove unrestricted SSH access
  community.general.ufw:
    rule: allow
    port: "{{ fishtrack_ssh_port | string }}"
    proto: tcp
    from_ip: any
    direction: in
    delete: true
  when: fishtrack_firewall_remove_broad_ssh | bool
