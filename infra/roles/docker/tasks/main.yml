---
- name: Check installed Docker-related packages
  ansible.builtin.package_facts:
    manager: auto

- name: Check for conflicting Docker packages
  ansible.builtin.assert:
    that:
      - "'docker.io' not in ansible_facts.packages"
      - "'containerd' not in ansible_facts.packages"
      - "'runc' not in ansible_facts.packages"
      - "'podman-docker' not in ansible_facts.packages"
    fail_msg: >-
      Conflicting Docker packages found.
      Review installed packages before proceeding.

- name: Create Docker APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download official Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  notify: Refresh Docker APT cache

- name: Add official Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  notify: Refresh Docker APT cache

- name: Apply pending Docker APT cache refresh
  ansible.builtin.meta: flush_handlers

- name: Install or update Docker Engine and Compose to latest stable versions
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: true
    cache_valid_time: 0
    lock_timeout: 120

- name: Read installed Docker Engine version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - docker-ce
  register: docker_installed_version
  changed_when: false

- name: Read available Docker Engine version
  ansible.builtin.command: apt-cache policy docker-ce
  register: docker_available_version
  changed_when: false
  environment:
    LC_ALL: C

- name: Verify Docker Engine is up to date
  ansible.builtin.assert:
    that:
      - >-
        docker_installed_version.stdout ==
        (docker_available_version.stdout |
         regex_findall('(?m)^\s*Candidate:\s*(\S+)') | first)
    fail_msg: "Docker Engine is not at the latest available APT version"
    success_msg: "Docker Engine is up to date"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
