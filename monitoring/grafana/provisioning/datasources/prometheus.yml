
apiVersion: 1

datasources:
  # Автоматическое подключение Prometheus.
  - name: Prometheus
    uid: fishtrack-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

    # Используем источник данных по умолчанию.
    isDefault: true

    # Управляем настройками через репозиторий.
    editable: false

    jsonData:
      httpMethod: POST
      timeInterval: 10s
