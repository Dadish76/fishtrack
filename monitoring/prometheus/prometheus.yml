
global:
  # Периодичность сбора метрик.
  scrape_interval: 10s

  # Максимальное время ожидания ответа.
  scrape_timeout: 5s

  # Периодичность вычисления правил.
  evaluation_interval: 10s

# Подключаем правила обнаружения проблем.
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Собственные метрики Prometheus.
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Метрики приложения FishTrack.
  - job_name: "fishtrack"
    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "app1:8000"
        labels:
          instance: "app1"

      - targets:
          - "app2:8000"
        labels:
          instance: "app2"

  # Инфраструктурные метрики Linux.
  - job_name: "node"
    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          instance: "fishtrack-host"

  # Метрики Docker-контейнеров.
  - job_name: "cadvisor"
    metrics_path: "/metrics"

    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          instance: "fishtrack-docker"
