
services:
  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring
      - fishtrack

  grafana:
    image: grafana/grafana:13.3.2-ubuntu
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

    networks:
      - monitoring

    depends_on:
      - prometheus

  # Сбор инфраструктурных метрик Linux.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    restart: unless-stopped

    pid: host

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.loadavg"
      - "--collector.diskstats"
      - "--collector.uname"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    networks:
      - monitoring


  # Сбор метрик использования ресурсов контейнерами.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: unless-stopped

    privileged: true
    cgroup: host

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"

      # Используем фактический сокет containerd.
      - "--containerd=/rootfs/run/containerd/containerd.sock"

    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring



networks:
  # Отдельная сеть системы мониторинга.
  monitoring:
    driver: bridge

  # Существующая сеть приложения FishTrack.
  fishtrack:
    external: true
    name: "${FISHTRACK_NETWORK:?FISHTRACK_NETWORK is required}"

volumes:
  # Хранение истории метрик.
  prometheus_data:

  # Хранение настроек и панелей Grafana.
  grafana_data:
