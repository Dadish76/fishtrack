
services:
  nginx:
    image: nginx:1.26.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - internal
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 50

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 100

  app1:
    build: .
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INSTANCE_ID: app1
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

  app2:
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INSTANCE_ID: app2
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: fishtrack_pg16_data
