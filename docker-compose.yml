services:

  nginx:
    image: nginx:1.26.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - internal
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 50

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    cpus: "1.0"
    mem_limit: 512m

  app1:
    build: .
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      INSTANCE_ID: app1
    networks:
      - internal
    depends_on:
      - db
    cpus: "0.5"
    mem_limit: 256m

  app2:
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      INSTANCE_ID: app2
    networks:
      - internal
    depends_on:
      - db
    cpus: "0.5"
    mem_limit: 256m

networks:
  internal:

volumes:
  postgres_data: