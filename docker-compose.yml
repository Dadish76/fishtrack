
services:
  nginx:
    image: nginx:1.26.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - internal
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 50

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 100

  app1:
    build: .
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INSTANCE_ID: app1
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      init-admin:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

  app2:
    image: fishtrack:0.4.0
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INSTANCE_ID: app2
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      init-admin:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

  migrate:
    image: fishtrack:0.4.0
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    
  db-restore:
    image: postgres:16.4-alpine
    profiles:
      - restore
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: "1.0"
    mem_limit: 512m

  init-admin:
    image: fishtrack:0.4.0
    command: ["python", "-m", "src.init_admin"]
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD_URLENCODED:?POSTGRES_PASSWORD_URLENCODED is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: fishtrack_pg16_data

  postgres_restore_data:
    name: fishtrack_restore_lab4
