
name: Infrastructure CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - feature/lab7-app-ansible

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-validation:
    name: Ansible syntax and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r infra/requirements.txt

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            -r infra/requirements.yml

      - name: Check Ansible syntax
        working-directory: infra
        run: |
          ansible-playbook \
            -i inventories/demo.yml \
            site.yml \
            --syntax-check

      - name: Run ansible-lint
        working-directory: infra
        run: ansible-lint site.yml

      - name: Verify Ansible Vault encryption
        run: |
          test -f infra/vault/demo.yml
          grep -q '^\$ANSIBLE_VAULT;' infra/vault/demo.yml
