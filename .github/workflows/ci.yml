name: FishTrack CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Quality: стиль, тесты, миграции, backup, безопасность.
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  # 2. Проверка Docker Compose и работы контейнеров.
  container_check:
    name: Container Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare CI environment
        shell: bash
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          CI_SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          CI_ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          : "${CI_POSTGRES_PASSWORD:?Missing CI_POSTGRES_PASSWORD}"
          : "${CI_SECRET_KEY:?Missing CI_SECRET_KEY}"
          : "${CI_ADMIN_PASSWORD:?Missing CI_ADMIN_PASSWORD}"

          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          password = os.environ["CI_POSTGRES_PASSWORD"]

          lines = [
              "POSTGRES_USER=fishtrack_user",
              f"POSTGRES_PASSWORD={password}",
              f"POSTGRES_PASSWORD_URLENCODED={quote(password, safe='')}",
              "POSTGRES_DB=fishtrack",
              f"SECRET_KEY={os.environ['CI_SECRET_KEY']}",
              f"ADMIN_PASSWORD={os.environ['CI_ADMIN_PASSWORD']}",
          ]

          Path(".env.container").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate Docker Compose
        shell: bash
        run: |
          docker compose \
            --env-file .env.container \
            config --quiet

      - name: Run container checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          make container-check 2>&1 | tee reports/container-check.log

      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-check-report
          path: reports/
          if-no-files-found: ignore

      - name: Stop test containers
        if: always()
        shell: bash
        run: |
          if [ -f .env.container ]; then
            docker compose \
              --env-file .env.container \
              down --remove-orphans || true
          fi

  # 3. Docker Build на GitHub-hosted Runner (не на staging).
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - quality
      - container_check

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "fishtrack:ci-${GITHUB_SHA}" \
            .

      - name: Export image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker save "fishtrack:ci-${GITHUB_SHA}" \
            | gzip -1 > artifacts/fishtrack.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: fishtrack-image-${{ github.sha }}
          path: artifacts/fishtrack.tar.gz
          if-no-files-found: error
          retention-days: 3

  # 4. Trivy проверяет именно собранный Docker-образ.
  image_scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: fishtrack-image-${{ github.sha }}
          path: artifacts

      - name: Load image
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc artifacts/fishtrack.tar.gz | docker load

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fishtrack:ci-${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.txt
          if-no-files-found: ignore

  # 5. Публикация ПРОВЕРЕННОГО образа на Ubuntu VM в локальный Registry.
  publish:
    name: Publish to Local Registry
    runs-on: [self-hosted, Linux, X64, fishtrack-cd]
    timeout-minutes: 20
    needs:
      - quality
      - container_check
      - build
      - image_scan
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Dadish76/fishtrack'
    permissions:
      contents: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Validate tag and local Registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi
          curl -fsS http://127.0.0.1:5000/v2/ > /dev/null
          echo "Local Registry is available"

      - name: Download verified Docker image
        uses: actions/download-artifact@v8
        with:
          name: fishtrack-image-${{ github.sha }}
          path: ci-artifacts

      - name: Load verified Docker image
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-artifacts/fishtrack.tar.gz
          gzip -dc ci-artifacts/fishtrack.tar.gz | docker load
          docker image inspect "fishtrack:ci-${GITHUB_SHA}" > /dev/null

      - name: Publish image to local Registry
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="fishtrack:ci-${GITHUB_SHA}"
          TARGET="localhost:5000/fishtrack:${IMAGE_TAG}"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Published image: $TARGET"

      - name: Publishing summary
        shell: bash
        run: |
          echo "### Local Registry publishing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`localhost:5000/fishtrack:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: verified GitHub Actions artifact" >> "$GITHUB_STEP_SUMMARY"

  # 6. CD: только после успешной публикации в локальный Registry.
  deploy_staging:
    name: Deploy to staging
    needs:
      - publish
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Dadish76/fishtrack'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
