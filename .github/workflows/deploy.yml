
name: FishTrack CD

# Вызывается заданием deploy_staging внутри FishTrack CI.
# Для этого не требуется переносить workflow в main.
on:
  workflow_call:

permissions:
  contents: read

# Не запускаем параллельные обновления одного staging.
concurrency:
  group: fishtrack-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Dadish76/fishtrack'

    runs-on: [self-hosted, Linux, X64, fishtrack-cd]
    timeout-minutes: 30

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi
          echo "Selected image tag: $IMAGE_TAG"

      - name: Download verified Docker image
        uses: actions/download-artifact@v8
        with:
          name: fishtrack-image-${{ github.sha }}
          path: ci-artifacts

      - name: Publish image to local Registry
        shell: bash
        run: |
          set -euo pipefail
          test -s ci-artifacts/fishtrack.tar.gz
          curl -fsS http://127.0.0.1:5000/v2/ > /dev/null

          # Готовый образ загружаем из артефакта CI, без docker build.
          docker load -i ci-artifacts/fishtrack.tar.gz

          SOURCE="fishtrack:ci-${GITHUB_SHA}"
          TARGET="localhost:5000/fishtrack:${IMAGE_TAG}"
          docker image inspect "$SOURCE" > /dev/null
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Published image: $TARGET"

      - name: Deploy image to staging
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy_staging.sh "$IMAGE_TAG"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "### FishTrack staging delivery" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`localhost:5000/fishtrack:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: fishtrack-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Basic HTTP checks: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full release acceptance: requires DevB smoke tests" >> "$GITHUB_STEP_SUMMARY"
