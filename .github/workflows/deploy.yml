
name: FishTrack CD

# Вызывается из FishTrack CI после публикации
# Docker-образа в локальный Registry.
on:
  workflow_call:

permissions:
  contents: read

# Защита от параллельного обновления staging.
concurrency:
  group: fishtrack-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging

    # Запускаем только после push в develop
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'Dadish76/fishtrack'

    # Собственный GitHub Actions Runner на Ubuntu VM
    runs-on: [self-hosted, Linux, X64, fishtrack-cd]
    timeout-minutes: 30

    env:
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      # 1. Получаем исходный код и скрипты деплоя
      - name: Checkout deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. Проверяем SHA-тег и доступность локального Registry
      - name: Validate image tag and local Registry
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

          curl -fsS http://127.0.0.1:5000/v2/ > /dev/null

          echo "Selected image: localhost:5000/fishtrack:${IMAGE_TAG}"

      # 3. Проверяем, что образ уже опубликован в локальном Registry
      - name: Check published image exists
        shell: bash
        run: |
          set -euo pipefail

          docker pull "localhost:5000/fishtrack:${IMAGE_TAG}"

      # 4. Развёртываем приложение в staging
      - name: Deploy image to staging
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/deploy_staging.sh "$IMAGE_TAG"

      # 5. Сохраняем результат развёртывания в GitHub Actions
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "### FishTrack staging delivery" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`localhost:5000/fishtrack:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: fishtrack-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP checks: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- CRUD smoke tests: passed" >> "$GITHUB_STEP_SUMMARY"
