
name: FishTrack CD

# Автоматически после CI и вручную для отката
on:
  workflow_run:
    workflows: ["FishTrack CI"]
    types: [completed]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег из локального Registry, например 0.4.0 или sha-..."
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Не допускаем одновременных деплоев
concurrency:
  group: fishtrack-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging

    # Автоматически — только успешный push в develop.
    # Вручную — только при выборе develop.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
      ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/develop')

    runs-on: [self-hosted, Linux, X64, fishtrack-cd]

    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'develop' }}
          persist-credentials: false

      - name: Validate image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] &&
             [[ ! "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

          echo "Selected image tag: $IMAGE_TAG"

      # Только автоматический выпуск:
      # скачиваем образ из уже завершённого CI
      - name: Download Docker image from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: fishtrack-image-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ci-artifacts

      # Загружаем готовый образ в локальный Registry
      - name: Publish image to local Registry
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          test -s ci-artifacts/fishtrack.tar.gz

          curl -fsS http://127.0.0.1:5000/v2/ > /dev/null

          docker load -i ci-artifacts/fishtrack.tar.gz

          SOURCE="fishtrack:ci-${RELEASE_SHA}"
          TARGET="localhost:5000/fishtrack:sha-${RELEASE_SHA}"

          docker image inspect "$SOURCE" > /dev/null

          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"

          echo "Published image: $TARGET"

      # Одинаковый механизм для автоматического
      # развертывания и ручного rollback
      - name: Deploy image to staging
        shell: bash
        run: |
          bash scripts/deploy_staging.sh "$IMAGE_TAG"

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "### FishTrack staging delivery" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`localhost:5000/fishtrack:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: fishtrack-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Basic HTTP checks: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full release acceptance: requires DevB smoke tests" >> "$GITHUB_STEP_SUMMARY"
