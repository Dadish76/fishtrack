
name: FishTrack Quality

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. STYLE AND SAST
  # ==========================================
  style:
    name: Style and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r backend/requirements-dev.txt

      - name: Run lint and Bandit
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          make lint 2>&1 | tee reports/lint.log
          make sast 2>&1 | tee reports/bandit.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: style-reports
          path: reports/
          if-no-files-found: ignore

  # ==========================================
  # 2. TESTS AND VERIFICATION
  # ==========================================
  tests:
    name: Tests and Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: fishtrack_test
          POSTGRES_PASSWORD: fishtrack_test_ci
          POSTGRES_DB: fishtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishtrack_test -d fishtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://fishtrack_test:fishtrack_test_ci@127.0.0.1:5432/fishtrack_test
      TEST_DATABASE_URL: postgresql+psycopg2://fishtrack_test:fishtrack_test_ci@127.0.0.1:5432/fishtrack_test
      SECRET_KEY: ci-only-test-secret-key
      ADMIN_PASSWORD: ci-only-test-password
      PGCONNECT_TIMEOUT: "5"
      PYTEST_ADDOPTS: "--maxfail=1 --tb=short --junitxml=reports/pytest.xml --cov-report=xml:reports/coverage.xml"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r backend/requirements-dev.txt

      - name: Run full verification
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          make verify 2>&1 | tee reports/verify.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  # ==========================================
  # 3. MIGRATIONS
  # ==========================================
  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: fishtrack_test
          POSTGRES_PASSWORD: fishtrack_test_ci
          POSTGRES_DB: fishtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishtrack_test -d fishtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://fishtrack_test:fishtrack_test_ci@127.0.0.1:5432/fishtrack_test
      SECRET_KEY: ci-only-test-secret-key
      ADMIN_PASSWORD: ci-only-test-password
      PGCONNECT_TIMEOUT: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r backend/requirements-dev.txt

      - name: Apply migrations
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          make migrate 2>&1 | tee reports/migrations.log

      - name: Check migration version
        shell: bash
        run: |
          set -o pipefail
          cd backend
          ../venv/bin/alembic current -v \
            2>&1 | tee -a ../reports/migrations.log

      - name: Upload migration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-reports
          path: reports/
          if-no-files-found: ignore
  # ==========================================
  # 4. BACKUP AND RESTORE
  # ==========================================
  backup:
    name: Backup and Restore
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: fishtrack_test
          POSTGRES_PASSWORD: fishtrack_test_ci
          POSTGRES_DB: fishtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishtrack_test -d fishtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://fishtrack_test:fishtrack_test_ci@127.0.0.1:5432/fishtrack_test
      SECRET_KEY: ci-only-test-secret-key
      ADMIN_PASSWORD: ci-only-test-password
      PGCONNECT_TIMEOUT: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r backend/requirements-dev.txt

      - name: Prepare database
        run: make migrate

      - name: Create backup and restore
        shell: bash
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p reports
          set -euo pipefail

          echo "Creating test data..."
          docker exec "$DB_CONTAINER" \
            psql -U fishtrack_test -d fishtrack_test \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE ci_backup_probe (id INTEGER PRIMARY KEY, note TEXT); INSERT INTO ci_backup_probe VALUES (1, 'backup_ok');"

          echo "Creating database backup..."
          docker exec "$DB_CONTAINER" \
            pg_dump -U fishtrack_test \
            -d fishtrack_test -Fc \
            > /tmp/fishtrack-ci.dump

          test -s /tmp/fishtrack-ci.dump

          echo "Creating empty restore database..."
          docker exec "$DB_CONTAINER" \
            createdb -U fishtrack_test fishtrack_restore_ci

          echo "Restoring backup..."
          docker exec -i "$DB_CONTAINER" \
            pg_restore --exit-on-error \
            -U fishtrack_test \
            -d fishtrack_restore_ci \
            --no-owner --no-privileges \
            < /tmp/fishtrack-ci.dump

          echo "Checking restored data..."
          result=$(docker exec "$DB_CONTAINER" \
            psql -U fishtrack_test \
            -d fishtrack_restore_ci -tAc \
            "SELECT note FROM ci_backup_probe WHERE id = 1;")

          test "$result" = "backup_ok"

          echo "Backup and Restore: PASS" \
            | tee reports/backup.log

      - name: Upload backup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-reports
          path: reports/
          if-no-files-found: ignore
