name: fishtrack-staging

x-app: &app
  image: localhost:5000/fishtrack:${IMAGE_TAG:?IMAGE_TAG required}
  environment: &app-env
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD_URLENCODED:?}@db:5432/${POSTGRES_DB:?}
    SECRET_KEY: ${SECRET_KEY:?}
    IMAGE_TAG: ${IMAGE_TAG:?IMAGE_TAG required}

  depends_on:
    db:
      condition: service_healthy

  restart: unless-stopped

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - staging-db-data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 15

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

    # Регулярная проверка готовности приложения.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  nginx:
    image: nginx:1.26.2-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staging-db-data:
