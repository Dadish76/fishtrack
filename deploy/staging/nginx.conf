events {}

http {
    # Безопасный формат журналов без секретов.
    log_format fishtrack_safe escape=json
        '{"timestamp":"$time_iso8601",'
        '"event":"proxy_request",'
        '"status_code":$status,'
        '"request_id":"$upstream_http_x_request_id",'
        '"duration_seconds":$request_time,'
        '"upstream_status":"$upstream_status"}';

    access_log /dev/stdout fishtrack_safe;
    error_log /dev/stderr crit;

    upstream fishtrack_backend {
        server app1:8000 max_fails=2 fail_timeout=10s;
        server app2:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        # Запрещаем внешний доступ к метрикам.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://fishtrack_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
